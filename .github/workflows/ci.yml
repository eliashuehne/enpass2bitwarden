name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: Vet
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build ./...
      - name: Test
        run: go test -v ./...
