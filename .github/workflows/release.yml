name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      # go-sqlcipher vendors its own codec-enabled sqlite3.c — no system
      # sqlcipher library needed, only a C compiler (present on all runners;
      # windows gets mingw gcc via choco).

      - name: Install C compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "CGO_ENABLED=1" | Out-File -Append $env:GITHUB_ENV

      - name: Build
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""
          if [[ "${{ matrix.target }}" == windows-* ]]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "enpass2bitwarden-${{ matrix.target }}${EXT}" ./cmd

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: enpass2bitwarden-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

  tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update homebrew tap
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git clone -q "https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/eliashuehne/homebrew-enpass2bitwarden.git" tap
          cd tap
          # regenerate formula from the template in the main repo
          curl -sL -o Formula/enpass2bitwarden.rb \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/Formula/enpass2bitwarden.rb"
          sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" Formula/enpass2bitwarden.rb
          for f in enpass2bitwarden-darwin-arm64 enpass2bitwarden-linux-amd64 enpass2bitwarden-linux-arm64; do
            sha=$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$f" | sha256sum | cut -d' ' -f1)
            # replace sha on the line following the matching url
            python3 - "$f" "$sha" <<'PYEOF'
import re,sys
plat,sha=sys.argv[1],sys.argv[2]
s=open('Formula/enpass2bitwarden.rb').read()
pat=re.compile(r'(url "https://[^"]*'+re.escape(plat)+r'"\n\s*sha256 ")[0-9a-f]+(")')
assert pat.search(s), plat
open('Formula/enpass2bitwarden.rb','w').write(pat.sub(r'\g<1>'+sha+r'\g<2>', s))
PYEOF
          done
          git config user.email "action@github.com"
          git config user.name "release-bot"
          if ! git diff --quiet; then
            git add -A && git commit -m "${GITHUB_REF_NAME}" && git push origin main
          fi
