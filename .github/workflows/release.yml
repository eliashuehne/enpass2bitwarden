name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      # go-sqlcipher vendors its own codec-enabled sqlite3.c — no system
      # sqlcipher library needed, only a C compiler (present on all runners;
      # windows gets mingw gcc via choco).

      - name: Install C compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "CGO_ENABLED=1" | Out-File -Append $env:GITHUB_ENV

      - name: Build
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""
          if [[ "${{ matrix.target }}" == windows-* ]]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o "enpass2bitwarden-${{ matrix.target }}${EXT}" ./cmd

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: enpass2bitwarden-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
